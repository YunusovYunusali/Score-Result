<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <link rel="stylesheet" href="./main.css">
    <title>Result</title>
</head>
<body>

  <main class="results-card">
  <section class="result-section">
    <h1 class="result-title">Your Result</h1>
    
    <div class="score-circle">
      <span class="score-number">76</span>
      <span class="score-max">of 100</span>
    </div>

    <h2 class="result-grade">Great</h2>
    <p class="result-description">
      Your performance exceed 65% of the people conducting the test here!
    </p>
  </section>

  <section class="summary-section">
    <h2 class="summary-title">Summary</h2>

    <ul class="summary-list">
      <li class="summary-item item-reaction">
        <div class="item-category">
          
          <span>Reaction</span>
        </div>
        <div class="item-score">
          <span class="score-bold">80</span> / 100
        </div>
      </li>

      <li class="summary-item item-memory">
        <div class="item-category">
         
          <span>Memory</span>
        </div>
        <div class="item-score">
          <span class="score-bold">92</span> / 100
        </div>
      </li>

      <li class="summary-item item-verbal">
        <div class="item-category">
          
          <span>Verbal</span>
        </div>
        <div class="item-score">
          <span class="score-bold">61</span> / 100
        </div>
      </li>

      <li class="summary-item item-visual">
        <div class="item-category">
          
          <span>Visual</span>
        </div>
        <div class="item-score">
          <span class="score-bold">73</span> / 100
        </div>
      </li>
    </ul>

    <button type="button" class="btn-continue">Continue</button>
  </section>
</main>
    
    <script src="./app.js"></script>
</body>
</html>
